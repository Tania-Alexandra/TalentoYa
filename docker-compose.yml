version: "3.8"

# ==============================================================================
# TalentoYa - Stack de Microservicios para Docker Swarm (EP03 - IE3 / IE7 / IE8)
# Despliegue: docker stack deploy -c docker-compose.yml talentoya
# ==============================================================================

services:
  api-gateway:
    image: ${DOCKER_REGISTRY:-duoc}/jv0101-caso02-api-gateway:${IMAGE_TAG:-1.0.0}
    ports:
      - target: 8080
        published: ${GATEWAY_PORT:-8090}
        protocol: tcp
        mode: ingress
    environment:
      GATEWAY_API_KEY: ${GATEWAY_API_KEY:-talentoya-secret-key-2026}
    networks:
      - talentoya-net
    deploy:
      mode: replicated
      replicas: ${GATEWAY_REPLICAS:-2}
      placement:
        preferences:
          - spread: node.id
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.10"
          memory: 64M
      update_config:
        parallelism: 1
        delay: 5s
        failure_action: rollback
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  perfiles-svc:
    image: ${DOCKER_REGISTRY:-duoc}/jv0101-caso02-perfiles:${IMAGE_TAG:-1.0.0}
    ports:
      - target: 8080
        published: ${PERFILES_PORT:-8080}
        protocol: tcp
        mode: ingress
    environment:
      PORT: "8080"
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
    networks:
      - talentoya-net
    deploy:
      mode: replicated
      replicas: ${PERFILES_REPLICAS:-2}
      placement:
        preferences:
          - spread: node.id
      resources:
        limits:
          cpus: "0.75"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 5s
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 60s

